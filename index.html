<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>승민쿠폰</title>
<style>
  :root {
    --bg: #f6f6f4;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #8a8a8e;
    --line: #e6e6e3;
    --accent: #ff6b4a;
    --money: #1f9d6b;
    --used: #c7c7cc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 16px 48px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0 20px;
  }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .balance {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; font-weight: 700; font-size: 15px;
    display: flex; align-items: center; gap: 6px;
    transition: transform .2s;
  }
  .balance small { color: var(--muted); font-weight: 500; font-size: 12px; }
  .balance.bump { transform: scale(1.12); }

  .hello { margin: 4px 0 20px; }
  .hello h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.5px; }
  .hello p { margin: 0; color: var(--muted); font-size: 14px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    padding: 7px 14px; border-radius: 999px; font-size: 14px; cursor: pointer;
  }
  .tab.on { background: var(--text); color: #fff; border-color: var(--text); }

  .list { display: flex; flex-direction: column; gap: 12px; }
  .coupon {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    display: flex; overflow: hidden; position: relative;
  }
  .coupon .side {
    width: 78px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff; font-weight: 800; font-size: 13px;
    border-right: 2px dashed rgba(255,255,255,.6); text-align: center; padding: 6px;
  }
  .coupon.money .side { background: var(--money); }
  .coupon.used .side { background: var(--used); }
  .coupon .body { flex: 1; padding: 14px 14px 12px; min-width: 0; }
  .coupon .title { font-weight: 700; font-size: 16px; margin-bottom: 2px; word-break: break-all; }
  .coupon .desc { color: var(--muted); font-size: 13px; margin-bottom: 10px; word-break: break-all; }
  .coupon .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .coupon .date { color: var(--muted); font-size: 12px; }
  .coupon.used .title, .coupon.used .desc { color: var(--used); }
  .empty small { font-size: 11px; word-break: break-all; }

  button.primary {
    background: var(--text); color: #fff; border: 0; border-radius: 10px;
    padding: 8px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.ghost {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  button.danger { color: #e5484d; border-color: #f3c9ca; }
  button:disabled { opacity: .4; cursor: default; }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; font-size: 14px; }

  .admin-link {
    display: block; margin: 32px auto 0; background: none; border: 0;
    color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: underline;
  }

  /* 관리자 패널 */
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 20px;
  }
  .panel h2 { font-size: 16px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 6px; }
  input, select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 15px; background: #fff; color: var(--text); font-family: inherit;
  }
  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; padding: 10px; border: 1px solid var(--line); background: #fff;
    border-radius: 10px; font-size: 14px; cursor: pointer; color: var(--muted);
  }
  .seg button.on { border-color: var(--text); color: var(--text); font-weight: 700; }
  .panel .primary { width: 100%; margin-top: 16px; padding: 12px; }

  /* 모달 / 토스트 */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.35);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--card); border-radius: 18px; padding: 22px; width: 100%; max-width: 340px;
    text-align: center;
  }
  .modal h3 { margin: 0 0 8px; font-size: 18px; }
  .modal p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .modal .btns { display: flex; gap: 8px; }
  .modal .btns button { flex: 1; padding: 12px; }
  .modal input { margin-bottom: 4px; text-align: center; letter-spacing: 4px; }
  .modal .err { color: #e5484d; font-size: 12px; min-height: 18px; margin-bottom: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: #fff; padding: 12px 18px; border-radius: 999px;
    font-size: 14px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 20;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">승민<span>쿠폰</span></div>
    <div class="balance" id="balance"><small>잔액</small><span id="balanceVal">0원</span></div>
  </header>

  <!-- 관리자 패널 (관리자 모드일 때만 표시) -->
  <section class="panel" id="adminPanel" hidden>
    <h2>관리자 · 쿠폰 추가 <button class="ghost" id="exitAdmin">나가기</button></h2>
    <div class="seg" id="typeSeg">
      <button type="button" data-type="normal" class="on">일반 쿠폰</button>
      <button type="button" data-type="money">머니 쿠폰</button>
    </div>
    <label for="cTitle">쿠폰 이름</label>
    <input id="cTitle" placeholder="예) 밥 한 끼 사주기" maxlength="40">
    <div id="amountWrap" hidden>
      <label for="cAmount">금액 (원)</label>
      <input id="cAmount" type="number" inputmode="numeric" min="1" placeholder="예) 10000">
    </div>
    <label for="cDesc">설명 (선택)</label>
    <input id="cDesc" placeholder="예) 유효기간 없음" maxlength="80">
    <button class="primary" id="addBtn">지급</button>
  </section>

  <div class="hello">
    <h1>사용자: 최요셉</h1>
    <p>쿠폰 지급됨.</p>
  </div>

  <div class="tabs">
    <button class="tab on" data-filter="available">사용 가능</button>
    <button class="tab" data-filter="used">사용 완료</button>
  </div>

  <div class="list" id="list"></div>

  <button class="admin-link" id="adminLink">관리자</button>
</div>

<!-- 확인 / 비밀번호 모달 -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <input id="mInput" type="password" inputmode="numeric" maxlength="12" hidden>
    <div class="err" id="mErr" hidden></div>
    <div class="btns">
      <button class="ghost" id="mCancel">취소</button>
      <button class="primary" id="mOk">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import {
    getFirestore, collection, doc, onSnapshot, addDoc, deleteDoc, getDoc, setDoc, runTransaction,
  } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: 'AIzaSyBG69kt2TfHI52TauiyGODy3pbeFVNIKYw',
    authDomain: 'cupon-a3d1e.firebaseapp.com',
    projectId: 'cupon-a3d1e',
    storageBucket: 'cupon-a3d1e.firebasestorage.app',
    messagingSenderId: '630961584674',
    appId: '1:630961584674:web:d85bdd28d7d435e0ca287b',
  };
  const db = getFirestore(initializeApp(firebaseConfig));
  const couponsRef = collection(db, 'coupons');
  const walletRef = doc(db, 'meta', 'wallet');
  const adminRef = doc(db, 'meta', 'admin');

  const ADMIN_KEY = 'seungmin-coupon-admin';
  const $ = (id) => document.getElementById(id);

  const state = { coupons: [], balance: 0, loaded: false, error: null };
  let filter = 'available';
  let isAdmin = false;
  let newType = 'normal';
  try { isAdmin = localStorage.getItem(ADMIN_KEY) === '1'; } catch (e) {}

  const won = (n) => (n || 0).toLocaleString('ko-KR') + '원';
  const fmtDate = (t) => {
    const d = new Date(t);
    return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
  };
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('seungmin-coupon:' + text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  function setAdmin(on) {
    isAdmin = on;
    try { on ? localStorage.setItem(ADMIN_KEY, '1') : localStorage.removeItem(ADMIN_KEY); } catch (e) {}
    render();
  }

  function render() {
    $('balanceVal').textContent = won(state.balance);
    $('adminPanel').hidden = !isAdmin;
    $('adminLink').hidden = isAdmin;

    if (state.error) {
      $('list').innerHTML = `<div class="empty">연결 실패.<br><small>${esc(state.error)}</small></div>`;
      return;
    }
    if (!state.loaded) {
      $('list').innerHTML = '<div class="empty">불러오는 중.</div>';
      return;
    }

    const items = state.coupons
      .filter((c) => (filter === 'used' ? c.used : !c.used))
      .sort((a, b) => (filter === 'used' ? b.usedAt - a.usedAt : b.createdAt - a.createdAt));

    if (!items.length) {
      $('list').innerHTML = `<div class="empty">${filter === 'used' ? '사용 내역 없음.' : '쿠폰 없음.'}</div>`;
      return;
    }

    $('list').innerHTML = items.map((c) => `
      <div class="coupon ${c.type === 'money' ? 'money' : ''} ${c.used ? 'used' : ''}">
        <div class="side">${c.type === 'money' ? won(c.amount) : 'COUPON'}</div>
        <div class="body">
          <div class="title">${esc(c.title)}</div>
          <div class="desc">${c.desc ? esc(c.desc) : (c.type === 'money' ? '사용 시 잔액 반영.' : '&nbsp;')}</div>
          <div class="row">
            <span class="date">${c.used ? fmtDate(c.usedAt) + ' 사용' : fmtDate(c.createdAt) + ' 받음'}</span>
            <span>
              ${isAdmin ? `<button class="ghost danger" data-del="${c.id}">삭제</button>` : ''}
              ${c.used ? '' : `<button class="primary" data-use="${c.id}">사용</button>`}
            </span>
          </div>
        </div>
      </div>`).join('');
  }

  // ---------- 실시간 동기화 ----------
  const onError = (err) => { state.error = err.message; render(); };

  onSnapshot(couponsRef, (snap) => {
    state.coupons = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    state.loaded = true;
    state.error = null;
    render();
  }, onError);

  onSnapshot(walletRef, (snap) => {
    const next = snap.exists() ? snap.data().balance || 0 : 0;
    if (next > state.balance && state.loaded) {
      $('balance').classList.add('bump');
      setTimeout(() => $('balance').classList.remove('bump'), 250);
    }
    state.balance = next;
    render();
  }, onError);

  // ---------- 모달 ----------
  function modal({ title, text, input = false, okText = '확인' }) {
    return new Promise((resolve) => {
      $('mTitle').textContent = title;
      $('mText').textContent = text;
      $('mInput').hidden = !input;
      $('mInput').value = '';
      $('mErr').hidden = true;
      $('mOk').textContent = okText;
      $('modalBg').classList.add('show');
      if (input) setTimeout(() => $('mInput').focus(), 50);

      const close = (v) => {
        $('modalBg').classList.remove('show');
        $('mOk').onclick = $('mCancel').onclick = $('mInput').onkeydown = null;
        resolve(v);
      };
      $('mOk').onclick = () => close(input ? $('mInput').value : true);
      $('mCancel').onclick = () => close(null);
      $('mInput').onkeydown = (e) => { if (e.key === 'Enter') $('mOk').click(); };
    });
  }

  let toastTimer;
  function toast(msg) {
    $('toast').textContent = msg;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2000);
  }

  // ---------- 쿠폰 사용 / 삭제 ----------
  $('list').addEventListener('click', async (e) => {
    const useId = e.target.dataset.use;
    const delId = e.target.dataset.del;

    if (useId) {
      const c = state.coupons.find((x) => x.id === useId);
      if (!c) return;
      const ok = await modal({
        title: `'${c.title}' 사용?`,
        text: c.type === 'money' ? `${won(c.amount)} 잔액 반영됨.` : '되돌릴 수 없음.',
        okText: '사용',
      });
      if (!ok) return;
      try {
        // 쿠폰 사용 처리와 잔액 충전을 한 번에 (중복 사용 방지)
        await runTransaction(db, async (tx) => {
          const ref = doc(db, 'coupons', useId);
          const snap = await tx.get(ref);
          if (!snap.exists() || snap.data().used) throw new Error('이미 사용된 쿠폰.');
          const data = snap.data();
          if (data.type === 'money') {
            const wallet = await tx.get(walletRef);
            const balance = wallet.exists() ? wallet.data().balance || 0 : 0;
            tx.set(walletRef, { balance: balance + data.amount });
          }
          tx.update(ref, { used: true, usedAt: Date.now() });
        });
        toast(c.type === 'money' ? `${won(c.amount)} 충전됨.` : '사용 처리됨. 승민에게 통보할 것.');
      } catch (err) {
        toast(err.message || '실패.');
      }
    }

    if (delId) {
      const ok = await modal({ title: '쿠폰 삭제', text: '삭제?', okText: '삭제' });
      if (!ok) return;
      try { await deleteDoc(doc(db, 'coupons', delId)); } catch (err) { toast('삭제 실패.'); }
    }
  });

  // ---------- 탭 ----------
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on'));
    t.classList.add('on');
    filter = t.dataset.filter;
    render();
  }));

  // ---------- 관리자 진입 ----------
  $('adminLink').addEventListener('click', async () => {
    let saved;
    try {
      saved = await getDoc(adminRef);
    } catch (err) {
      toast('연결 실패.');
      return;
    }
    if (!saved.exists()) {
      const pin = await modal({ title: '관리자 비밀번호 설정', text: '비밀번호 설정.', input: true });
      if (!pin) return;
      await setDoc(adminRef, { pinHash: await sha256(pin) });
    } else {
      const pin = await modal({ title: '관리자 로그인', text: '비밀번호 입력.', input: true });
      if (pin === null) return;
      if ((await sha256(pin)) !== saved.data().pinHash) { toast('비밀번호 불일치.'); return; }
    }
    setAdmin(true);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('exitAdmin').addEventListener('click', () => setAdmin(false));

  // ---------- 쿠폰 추가 ----------
  document.querySelectorAll('#typeSeg button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('#typeSeg button').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    newType = b.dataset.type;
    $('amountWrap').hidden = newType !== 'money';
  }));

  $('addBtn').addEventListener('click', async () => {
    const title = $('cTitle').value.trim();
    const desc = $('cDesc').value.trim();
    const amount = Math.floor(Number($('cAmount').value));

    if (!title) { toast('쿠폰 이름 필요.'); return; }
    if (newType === 'money' && !(amount > 0)) { toast('금액 필요.'); return; }

    $('addBtn').disabled = true;
    try {
      await addDoc(couponsRef, {
        type: newType,
        title,
        desc,
        amount: newType === 'money' ? amount : 0,
        used: false,
        createdAt: Date.now(),
      });
      $('cTitle').value = $('cDesc').value = $('cAmount').value = '';
      filter = 'available';
      document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x.dataset.filter === 'available'));
      render();
      toast('지급 완료.');
    } catch (err) {
      toast('지급 실패.');
    } finally {
      $('addBtn').disabled = false;
    }
  });

  render();
</script>
</body>
</html>
